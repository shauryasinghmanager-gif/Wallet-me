<style>
        /* No external font import — everything below uses local/system fonts so the app works fully offline. */

        .vv-wrap { height: 100dvh; width: 100vw; overflow: hidden; background: #0B0F14; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        .vv-wrap * { box-sizing: border-box; }

        .vv-app {
          --bg: #0B0F14; --surface: #131924; --surface-2: #1A2230; --border: #232C3D;
          --text: #EDEFF3; --text-muted: #8B94A7; --gold: #C9A227; --gold-rgb: 201, 162, 39; --pos: #4FA97F; --neg: #D96C6C;
          position: relative; width: 100%; height: 100dvh; overflow: hidden;
          background: radial-gradient(120% 60% at 50% -10%, #161D2C 0%, var(--bg) 55%);
          color: var(--text); display: flex; flex-direction: column;
        }

        .vv-header { flex-shrink: 0; padding: max(18px, env(safe-area-inset-top)) 18px 14px;
          display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--border);
          background: var(--bg); z-index: 5; }
        .vv-header-eyebrow { display: flex; align-items: center; gap: 6px; color: var(--text-muted);
          font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 3px; }
        .vv-header-title { font-family: Georgia, 'Times New Roman', serif; font-weight: 500; font-size: 20px; }
        .vv-header-block { flex: 1; }
        .vv-header-btn { background: transparent; border: none; color: var(--text); width: 34px; height: 34px;
          border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
        .vv-header-btn:hover { background: var(--surface-2); }
        .vv-header-btn:active { transform: scale(0.92); }
        .vv-header-actions { display: flex; gap: 2px; }

        .vv-content { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; position: relative; }
        .vv-content.with-tabbar { padding-bottom: 84px; }
        @keyframes vvSlideFwd { from { opacity: 0; transform: translateX(14px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes vvSlideBack { from { opacity: 0; transform: translateX(-14px); } to { opacity: 1; transform: translateX(0); } }
        .vv-anim-fwd { animation: vvSlideFwd 0.22s cubic-bezier(.2,.8,.3,1); }
        .vv-anim-back { animation: vvSlideBack 0.22s cubic-bezier(.2,.8,.3,1); }
        @keyframes vvArc { from { stroke-dashoffset: 100; } to { stroke-dashoffset: 0; } }
        .vv-arc { stroke-dasharray: 100; stroke-dashoffset: 100; animation: vvArc 0.85s cubic-bezier(.25,.75,.2,1) forwards; }
        @keyframes vvRise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        .vv-rise { opacity: 0; animation: vvRise 0.4s ease forwards; }
        @keyframes vvDetailIn { from { opacity: 0; transform: translateX(18px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes vvDetailOut { from { opacity: 1; transform: translateX(0); } to { opacity: 0; transform: translateX(18px); } }
        .vv-detail-enter { animation: vvDetailIn 0.22s cubic-bezier(.2,.8,.3,1); }
        .vv-detail-exit { animation: vvDetailOut 0.2s ease forwards; }

        .vv-section { padding: 18px 18px 4px; }
        .vv-section-title { font-family: Georgia, 'Times New Roman', serif; font-size: 16px; font-weight: 500; }
        .vv-see-all { font-size: 12px; color: var(--gold); background: none; border: none; cursor: pointer; }

        .vv-hero { margin: 4px 18px 16px; background: linear-gradient(180deg, var(--surface) 0%, #10151F 100%);
          border: 1px solid var(--border); border-radius: 22px; padding: 24px 18px; display: flex;
          flex-direction: column; align-items: center; gap: 18px; }
        .vv-dial-wrap { position: relative; width: 210px; height: 210px; }
        .vv-dial-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .vv-networth-label { font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 6px; }
        .vv-networth-figure { font-family: Georgia, 'Times New Roman', serif; font-weight: 500; font-size: 26px; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
        .vv-networth-sub { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 10.5px; color: var(--text-muted); margin-top: 6px; }
        .vv-legend { width: 100%; display: flex; flex-direction: column; gap: 9px; }
        .vv-legend-row { display: flex; align-items: center; gap: 9px; font-size: 13.5px; }
        .vv-swatch { width: 9px; height: 9px; border-radius: 2px; flex-shrink: 0; }
        .vv-legend-label { color: var(--text); flex: 1; }
        .vv-legend-pct { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; color: var(--text-muted); font-size: 12px; }
        .vv-legend-amt { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; color: var(--text); font-size: 12.5px; min-width: 84px; text-align: right; }

        .vv-stat-card { margin: 0 18px 20px; display: flex; align-items: center; background: var(--surface);
          border: 1px solid var(--border); border-radius: 16px; padding: 14px 16px; }
        .vv-stat-col { flex: 1; min-width: 0; }
        .vv-stat-label { font-size: 10.5px; color: var(--text-muted); display: flex; align-items: center; gap: 5px; margin-bottom: 6px; white-space: nowrap; }
        .vv-stat-value { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 14.5px; }
        .vv-stat-value.pos { color: var(--pos); }
        .vv-stat-value.neg { color: var(--neg); }
        .vv-stat-divider { width: 1px; align-self: stretch; background: var(--border); margin: 0 14px; }

        .vv-group { border: 1px solid var(--border); border-radius: 16px; background: var(--surface); margin: 0 18px 14px; overflow: hidden; }
        .vv-group-head { display: flex; align-items: center; gap: 10px; padding: 13px 16px; background: var(--surface-2); border-bottom: 1px solid var(--border); }
        .vv-group-icon { width: 28px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .vv-group-name { font-weight: 600; font-size: 13.5px; flex: 1; }
        .vv-group-total { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 13.5px; }

        .vv-swipe-wrap { position: relative; overflow: hidden; border-bottom: 1px solid var(--border); }
        .vv-swipe-wrap:last-child { border-bottom: none; }
        .vv-swipe-actions { position: absolute; top: 0; bottom: 0; right: 0; width: 136px; display: flex; }
        .vv-swipe-action { flex: 1; border: none; display: flex; flex-direction: column; align-items: center;
          justify-content: center; gap: 2px; font-size: 10.5px; color: #fff; cursor: pointer; }
        .vv-swipe-action.edit { background: #3B4A6B; }
        .vv-swipe-action.delete { background: #7A2E2E; }
        .vv-swipe-content { position: relative; background: var(--surface); touch-action: pan-y;
          transition: transform 0.18s ease; will-change: transform; user-select: none; -webkit-user-select: none; }

        .vv-row { display: flex; align-items: center; gap: 12px; padding: 13px 16px; cursor: pointer; }
        .vv-row-main { flex: 1; min-width: 0; }
        .vv-row-label { font-size: 14px; color: var(--text); }
        .vv-row-inst { font-size: 11.5px; color: var(--text-muted); margin-top: 2px; }
        .vv-row-balance { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 13.5px; color: var(--text); text-align: right; }
        .vv-row-eye { background: none; border: none; color: var(--text-muted); width: 26px; height: 26px;
          border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
        .vv-row-eye:hover { background: var(--surface-2); color: var(--text); }

        .vv-txn-row { display: flex; align-items: center; gap: 11px; padding: 12px 16px; border-bottom: 1px solid var(--border); cursor: pointer; }
        .vv-txn-row:last-child { border-bottom: none; }
        .vv-txn-row:active { background: #171F2C; }
        .vv-txn-icon { width: 32px; height: 32px; border-radius: 999px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .vv-txn-main { flex: 1; min-width: 0; }
        .vv-txn-note { font-size: 13.5px; color: var(--text); }
        .vv-txn-meta { font-size: 11.5px; color: var(--text-muted); margin-top: 2px; }
        .vv-txn-amt { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 13.5px; flex-shrink: 0; }
        .vv-date-heading { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted); padding: 14px 16px 6px; }
        .vv-empty { padding: 18px 16px; color: var(--text-muted); font-size: 13px; font-style: italic; }

        .vv-segment { display: flex; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 3px; margin: 6px 18px 12px; }
        .vv-segment-btn { flex: 1; text-align: center; padding: 8px; font-size: 12.5px; border-radius: 9px; color: var(--text-muted); cursor: pointer; border: none; background: none; }
        .vv-segment-btn.active { background: var(--surface-2); color: var(--text); }
        .vv-search-wrap { position: relative; margin: 0 18px 14px; }
        .vv-search-wrap svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
        .vv-search-wrap input { padding-left: 36px; }

        .vv-skeleton { background: linear-gradient(90deg, #131924 25%, #1c2432 37%, #131924 63%); background-size: 400% 100%; animation: vvShimmer 1.4s ease infinite; }
        @keyframes vvShimmer { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }

        .vv-tabbar { flex-shrink: 0; display: flex; align-items: center; justify-content: space-around;
          padding: 6px 8px max(8px, env(safe-area-inset-bottom)); background: var(--surface);
          border-top: 1px solid var(--border); position: relative; z-index: 20; }        .vv-tab { background: none; border: none; display: flex; flex-direction: column; align-items: center;
          gap: 4px; color: var(--text-muted); font-size: 10px; font-weight: 500; letter-spacing: 0.01em;
          padding: 4px 10px 2px; cursor: pointer; width: 72px; transition: color 0.15s ease; }
        .vv-tab.active { color: var(--gold); }
        .vv-tab:active { transform: scale(0.96); }
        .vv-tab-pill { display: flex; align-items: center; justify-content: center; width: 40px; height: 30px;
          border-radius: 10px; color: inherit; position: relative; z-index: 1; }
        .vv-tab-indicator { position: absolute; top: 6px; height: 30px; border-radius: 10px;
          background: rgba(var(--gold-rgb), 0.14); transition: left 0.28s cubic-bezier(.2,.8,.3,1), width 0.28s cubic-bezier(.2,.8,.3,1), opacity 0.2s ease; }
        .vv-fab-float { position: absolute; right: 18px; bottom: 84px; width: 56px; height: 56px; border-radius: 999px;
          background: var(--gold); border: none; display: flex; align-items: center; justify-content: center;
          color: #14110A; cursor: pointer; box-shadow: 0 10px 24px rgba(var(--gold-rgb),0.32), 0 2px 8px rgba(0,0,0,0.3);
          z-index: 25; transition: transform 0.12s ease; }
        .vv-fab-float:active { transform: scale(0.92); }

        .vv-settings-row { display: flex; align-items: center; justify-content: space-between; padding: 13px 16px;
          border-bottom: 1px solid var(--border); font-size: 13.5px; }
        .vv-settings-row:last-child { border-bottom: none; }
        .vv-settings-label { color: var(--text-muted); font-size: 12.5px; }
        .vv-settings-value { color: var(--text); font-size: 13.5px; font-family: 'SFMono-Regular', Menlo, Consolas, monospace; }
        .vv-danger-btn { width: 100%; background: rgba(217,108,108,0.1); border: 1px solid rgba(217,108,108,0.4);
          color: var(--neg); border-radius: 12px; padding: 13px; font-size: 13.5px; font-weight: 600; cursor: pointer;
          display: flex; align-items: center; justify-content: center; gap: 6px; }
        .vv-danger-btn:active { background: rgba(217,108,108,0.2); }
        .vv-about-block { padding: 22px 24px 8px; text-align: center; color: var(--text-muted); font-size: 11.5px; line-height: 1.6; }

        .vv-theme-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .vv-theme-opt { position: relative; display: flex; align-items: center; gap: 9px; padding: 11px 12px;
          border: 1px solid var(--border); border-radius: 12px; background: var(--bg); color: var(--text-muted);
          font-size: 12.5px; cursor: pointer; }
        .vv-theme-opt.active { border-color: var(--swatch); color: var(--text); }
        .vv-theme-dot { width: 16px; height: 16px; border-radius: 999px; background: var(--swatch); flex-shrink: 0;
          box-shadow: 0 0 0 3px rgba(var(--gold-rgb), 0); }
        .vv-theme-opt.active .vv-theme-dot { box-shadow: 0 0 0 3px color-mix(in srgb, var(--swatch) 25%, transparent); }
        .vv-theme-check { position: absolute; right: 10px; color: var(--swatch); }
        .vv-outline-btn-block { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
          background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px;
          color: var(--text); font-size: 13px; font-weight: 500; cursor: pointer; }
        .vv-outline-btn-block:active { background: var(--surface-2); }

        .vv-detail-hero { margin: 4px 18px 4px; padding: 22px 4px 4px; text-align: center; }
        .vv-detail-tag { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-muted);
          background: var(--surface-2); padding: 5px 12px; border-radius: 999px; margin-bottom: 14px; }
        .vv-detail-balance-label { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-muted); }
        .vv-detail-balance { font-family: Georgia, 'Times New Roman', serif; font-size: 34px; margin-top: 6px; font-variant-numeric: tabular-nums; }
        .vv-detail-inst { font-size: 12.5px; color: var(--text-muted); margin-top: 4px; }
        .vv-sparkline { width: 100%; height: 48px; margin-top: 16px; }
        .vv-detail-actions { display: flex; gap: 10px; margin: 20px 18px 8px; }
        .vv-action-btn { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px;
          background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 13px 8px;
          color: var(--text); font-size: 12px; cursor: pointer; }
        .vv-action-btn:active { background: var(--surface-2); }
        .vv-action-icon { width: 34px; height: 34px; border-radius: 999px; background: var(--surface-2); display: flex; align-items: center; justify-content: center; }

        .vv-sheet-overlay { position: absolute; inset: 0; background: rgba(5,7,10,0.6); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); z-index: 50; display: flex; align-items: flex-end; animation: vvBackdrop 0.18s ease; }
        .vv-sheet-overlay.closing { animation: vvBackdropOut 0.2s ease forwards; }
        @keyframes vvBackdrop { from { opacity: 0; } to { opacity: 1; } }
        @keyframes vvBackdropOut { from { opacity: 1; } to { opacity: 0; } }
        .vv-sheet { width: 100%; background: var(--surface-2); border-radius: 22px 22px 0 0; border: 1px solid var(--border);
          border-bottom: none; padding: 10px 20px max(20px, env(safe-area-inset-bottom)); max-height: 86%;
          overflow-y: auto; animation: vvSlideUp 0.24s cubic-bezier(.2,.8,.3,1); }
        .vv-sheet.closing { animation: vvSlideDown 0.2s ease forwards; }
        @keyframes vvSlideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        @keyframes vvSlideDown { from { transform: translateY(0); } to { transform: translateY(100%); } }
        .vv-drag-handle { width: 36px; height: 4px; border-radius: 999px; background: var(--border); margin: 4px auto 14px; }
        .vv-sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
        .vv-sheet-title { font-family: Georgia, 'Times New Roman', serif; font-size: 18px; font-weight: 500; }

        .vv-field { margin-bottom: 14px; }
        .vv-field label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
        .vv-input, .vv-select { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
          padding: 12px 13px; color: var(--text); font-size: 15px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        .vv-input:focus, .vv-select:focus { outline: 2px solid var(--gold); outline-offset: 1px; border-color: transparent; }
        .vv-cat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .vv-cat-opt { display: flex; flex-direction: column; align-items: center; gap: 5px; border: 1px solid var(--border);
          border-radius: 12px; padding: 10px 4px; cursor: pointer; background: var(--bg); color: var(--text-muted); font-size: 11px; }
        .vv-cat-opt.active { border-color: var(--gold); color: var(--text); }
        .vv-type-toggle { display: flex; gap: 8px; }
        .vv-type-opt { flex: 1; text-align: center; border: 1px solid var(--border); border-radius: 10px; padding: 11px;
          cursor: pointer; font-size: 13.5px; color: var(--text-muted); background: var(--bg); }
        .vv-type-opt.active.credit { border-color: var(--pos); color: var(--pos); }
        .vv-type-opt.active.debit { border-color: var(--neg); color: var(--neg); }
        .vv-form-error { color: #E08585; font-size: 12.5px; margin-bottom: 12px; }

};

/* ---------- formatting helpers ---------- */
function formatINR(n) {
  const num = Number(n);
  const safe = Number.isFinite(num) ? num : 0;
  const sign = safe < 0 ? "-" : "";
  const abs = Math.abs(Math.round(safe));
  return sign + "₹" + abs.toLocaleString("en-IN");
}
function formatTime(iso) { return new Date(iso).toLocaleTimeString("en-IN", { hour: "numeric", minute: "2-digit" }); }
function dateGroupLabel(iso) {
  const d = new Date(iso), now = new Date();
  if (d.toDateString() === now.toDateString()) return "Today";
  const yest = new Date(now); yest.setDate(yest.getDate() - 1);
  if (d.toDateString() === yest.toDateString()) return "Yesterday";
  const opts = { day: "numeric", month: "long" };
  if (d.getFullYear() !== now.getFullYear()) opts.year = "numeric";
  return d.toLocaleDateString("en-IN", opts);
}
function formatDateTime(iso) { return `${dateGroupLabel(iso)}, ${formatTime(iso)}`; }
function todayInputValue() {
  const d = new Date(); const off = d.getTimezoneOffset();
  return new Date(d.getTime() - off * 60000).toISOString().slice(0, 10);
}
function groupTxnsByDate(list) {
  const sorted = [...list].sort((a, b) => new Date(b.date) - new Date(a.date));
  const groups = [];
  sorted.forEach((t) => {
    const label = dateGroupLabel(t.date);
    let g = groups.find((x) => x.label === label);
    if (!g) { g = { label, items: [] }; groups.push(g); }
    g.items.push(t);
  });
  return groups;
}
function polarToCartesian(cx, cy, r, angleDeg) {
  const rad = ((angleDeg - 90) * Math.PI) / 180;
  return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
}
function describeArc(cx, cy, r, startAngle, endAngle) {
  const start = polarToCartesian(cx, cy, r, endAngle);
  const end = polarToCartesian(cx, cy, r, startAngle);
  const largeArc = endAngle - startAngle <= 180 ? 0 : 1;
  return `M ${start.x} ${start.y} A ${r} ${r} 0 ${largeArc} 0 ${end.x} ${end.y}`;
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

/* ---------- state ---------- */

  }
  toastTimer = setTimeout(() => { root.innerHTML = ""; }, 4500);
}

/* ---------- derived data ---------- */
function computeByCategory() {
  const map = {};
  CATEGORY_ORDER.forEach((c) => (map[c] = { total: 0, items: [] }));
  state.accounts.forEach((a) => {
    const cat = map[a.category] ? a.category : "other";
    map[cat].total += Number(a.balance || 0);
    map[cat].items.push(a);
  });
  return map;
}
function computeNetWorth() { return state.accounts.reduce((s, a) => s + Number(a.balance || 0), 0); }
function computeRing(byCategory) {
  const positiveTotal = CATEGORY_ORDER.reduce((s, c) => s + Math.max(byCategory[c].total, 0), 0);
  const active = CATEGORY_ORDER.filter((c) => byCategory[c].total > 0);
  const gap = active.length > 1 ? 3 : 0;
  const usable = 360 - gap * active.length;
  let cursor = 0;
  return active.map((c) => {
    const frac = positiveTotal > 0 ? byCategory[c].total / positiveTotal : 0;
    const sweep = frac * usable;
    const seg = { category: c, start: cursor, end: cursor + sweep };
    cursor += sweep + gap;
    return seg;
  });
}
function computeMonthStats() {
  const now = new Date(); const m = now.getMonth(), y = now.getFullYear();
  let income = 0, expense = 0;
  state.txns.forEach((t) => {
    if (t.transferId) return;
    const d = new Date(t.date);
    if (d.getMonth() === m && d.getFullYear() === y) { if (t.type === "credit") income += t.amount; else expense += t.amount; }
  });
  return { income, expense };
}
function computeDetailPoints(accId) {
  const acc = accountById(accId);
  if (!acc) return [];
  const rows = state.txns.filter((t) => t.accountId === accId).sort((a, b) => new Date(a.date) - new Date(b.date));
  const net = rows.reduce((s, t) => s + (t.type === "credit" ? t.amount : -t.amount), 0);
  let running = acc.balance - net;
  const pts = [running];
  rows.forEach((t) => { running += t.type === "credit" ? t.amount : -t.amount; pts.push(running); });
  return pts;
}
function sparklineStr(points) {
  if (points.length < 2) return "";
  const min = Math.min(...points), max = Math.max(...points), range = max - min || 1;
  const w = 300, h = 48, pad = 4;
  return points.map((v, i) => {
    const x = (i / (points.length - 1)) * w;
    const y = h - pad - ((v - min) / range) * (h - pad * 2);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(" ");
}

/* ---------- swipeable account row ---------- */
const SWIPE_WIDTH = 136;
function attachSwipe(el, id) {
  let dragX = state.openRowId === id ? -SWIPE_WIDTH : 0;
  let dragging = false, moved = false, directionDecided = false, captured = false;
  let startX = 0, startY = 0, startTranslate = 0, pointerId = null;
  const content = el.querySelector(".vv-swipe-content");
  content.style.transform = `translateX(${dragX}px)`;
  content.addEventListener("pointerdown", (e) => {
    dragging = false; moved = false; directionDecided = false; captured = false;
    startX = e.clientX; startY = e.clientY; startTranslate = dragX; pointerId = e.pointerId;
  });
  content.addEventListener("pointermove", (e) => {
    if (pointerId === null || e.pointerId !== pointerId) return;
    const deltaX = e.clientX - startX, deltaY = e.clientY - startY;
    if (!directionDecided) {
      // Wait for a clear enough movement before committing to a direction —
      // this keeps normal vertical scrolling working when a swipe starts on a row.
      if (Math.abs(deltaX) < 6 && Math.abs(deltaY) < 6) return;
      directionDecided = true;
      if (Math.abs(deltaX) > Math.abs(deltaY)) {
        dragging = true;
        try { content.setPointerCapture(pointerId); captured = true; } catch (err) {}
      } else {
        return; // vertical gesture — let the browser handle scrolling
      }
    }
    if (!dragging) return;
    if (Math.abs(deltaX) > 4) moved = true;
    dragX = Math.max(-SWIPE_WIDTH, Math.min(0, startTranslate + deltaX));
    content.style.transform = `translateX(${dragX}px)`;
  });
  const finish = (e) => {
    if (captured && pointerId !== null) { try { content.releasePointerCapture(pointerId); } catch (err) {} }
    if (!dragging) { pointerId = null; return; }
    dragging = false;
    pointerId = null;
    if (!moved) {
      if (state.openRowId === id) { state.openRowId = null; renderContent(); }
      else { openAccountDetail(id); }
      return;
    }
    if (dragX < -SWIPE_WIDTH / 2) { dragX = -SWIPE_WIDTH; state.openRowId = id; }
    else { dragX = 0; state.openRowId = null; }
    content.style.transform = `translateX(${dragX}px)`;
  };
  content.addEventListener("pointerup", finish);
  content.addEventListener("pointercancel", finish);
}

    const p1 = polarToCartesian(cx, cy, inner, angle), p2 = polarToCartesian(cx, cy, outer, angle);
    ticks += `<line x1="${p1.x}" y1="${p1.y}" x2="${p2.x}" y2="${p2.y}" stroke="${long ? "#2C3648" : "#1E2634"}" stroke-width="${long ? 1.6 : 1}"/>`;
  }
  const arcs = ring.map((seg, i) => `<path d="${describeArc(cx, cy, r, seg.start, seg.end)}" fill="none" stroke="${CATEGORIES[seg.category].color}" stroke-width="${stroke}" stroke-linecap="round" pathLength="100" class="vv-arc" style="animation-delay:${i * 90}ms"/>`).join("");

/* ---------- master content render ---------- */
function renderContent() {
  const el = document.getElementById("content");
  const dir = TAB_ORDER.indexOf(state.activeTab) >= state.prevTabIndex ? "vv-anim-fwd" : "vv-anim-back";
  el.className = "vv-content" + (!state.detailId ? " with-tabbar" : "");

  if (state.detailId) {
    el.innerHTML = `<div class="${state.closingDetail ? "vv-detail-exit" : "vv-detail-enter"}">${detailHTML(state.detailId)}</div>`;
    wireDetailEvents();
    return;
  }
  let inner = "";
  if (state.activeTab === "home") inner = homeHTML();
  else if (state.activeTab === "accounts") inner = accountsHTML();
  else if (state.activeTab === "activity") inner = activityHTML();
  else inner = settingsHTML();
  el.innerHTML = `<div class="${dir}" style="padding-top:6px">${inner}</div>`;
  wireContentEvents();
  if (state.activeTab === "home") animateNetWorth();
}

function wireContentEvents() {
  document.querySelectorAll("[data-txn-account]").forEach((row) => {
    row.onclick = () => openAccountDetail(row.getAttribute("data-txn-account"));
  });
  if (state.activeTab === "home") {
    const seeAll = document.getElementById("seeAllBtn");
    if (seeAll) seeAll.onclick = () => setActiveTab("activity");
  }
  if (state.activeTab === "accounts") {
    document.querySelectorAll("[data-swipe-id]").forEach((wrap) => attachSwipe(wrap, wrap.getAttribute("data-swipe-id")));
    document.querySelectorAll("[data-edit]").forEach((btn) => {
      btn.onclick = () => { state.openRowId = null; openAccountSheet(btn.getAttribute("data-edit")); };
    });
    document.querySelectorAll("[data-delete]").forEach((btn) => {
      btn.onclick = () => { state.openRowId = null; deleteAccount(btn.getAttribute("data-delete")); };
    });
    document.querySelectorAll("[data-eye]").forEach((btn) => {
      btn.addEventListener("pointerdown", (e) => e.stopPropagation());
      btn.addEventListener("click", (e) => { e.stopPropagation(); toggleAccountHidden(btn.getAttribute("data-eye")); });
    });
  }
  if (state.activeTab === "activity") {
    document.querySelectorAll("[data-filter]").forEach((btn) => {
      btn.onclick = () => { state.activityFilter = btn.getAttribute("data-filter"); renderContent(); };
    });
    const search = document.getElementById("activitySearchInput");
    if (search) {
      search.oninput = () => { state.activitySearch = search.value; renderActivityListOnly(); };
    }
  }
  if (state.activeTab === "settings") wireSettingsEvents();
}

function renderActivityListOnly() {
  // rebuild just the list/segment part without losing search input focus
  const el = document.getElementById("content").firstElementChild;
  const filtered = state.txns.filter((t) => {
    if (state.activityFilter === "in" && t.type !== "credit") return false;
    if (state.activityFilter === "out" && t.type !== "debit") return false;
    if (state.activitySearch.trim()) {
      const q = state.activitySearch.trim().toLowerCase();
      const acc = accountById(t.accountId);
      const hay = (t.note + " " + (acc ? acc.label : "")).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  let list;
  if (filtered.length === 0) {
    list = `<div class="vv-group"><div class="vv-empty">${state.txns.length === 0 ? "No activity yet. Transfers and transactions you add will show up here." : "No transactions match."}</div></div>`;

  });

/* ---------- net worth count-up ---------- */
function animateNetWorth() {
  const el = document.getElementById("networthFigure");
  if (!el || state.hideAll) { state.lastNetWorth = computeNetWorth(); return; }
  const to = computeNetWorth();
  const from = state.lastNetWorth == null ? to : state.lastNetWorth;
  state.lastNetWorth = to;
  if (from === to) { el.textContent = formatINR(to); return; }
  const duration = 650, start = performance.now();
  function tick(now) {
    const t = Math.min(1, (now - start) / duration);
    const eased = 1 - Math.pow(1 - t, 3);
    el.textContent = formatINR(from + (to - from) * eased);
    if (t < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

/* ---------- account CRUD ---------- */
function openAccountDetail(id) {
  state.detailId = id;
  state.closingDetail = false;
  renderHeader(); renderContent(); renderTabbar(); renderFab();
}
function closeDetail() {
  state.closingDetail = true;
  renderContent();
  setTimeout(() => {
    state.detailId = null;
    state.closingDetail = false;
    renderHeader(); renderContent(); renderTabbar(); renderFab();
  }, 200);
}
function deleteAccount(id) {
  const acc = accountById(id);
  if (!acc) return;
  const relatedTxns = state.txns.filter((t) => t.accountId === id);
  const nextAccounts = state.accounts.filter((a) => a.id !== id);
  const nextTxns = state.txns.filter((t) => t.accountId !== id);
  persistAccounts(nextAccounts);
  persistTxns(nextTxns);
  if (state.detailId === id) { state.detailId = null; renderHeader(); renderTabbar(); renderFab(); }
  state.openRowId = null;
  renderContent();
  showToast(`${acc.label} deleted`, "Undo", () => { persistAccounts([...nextAccounts, acc]); persistTxns([...nextTxns, ...relatedTxns]); renderHeader(); renderContent(); });
}
function handleResetData() {
  if (!state.resetArm) {
    state.resetArm = true;
    if (resetTimer) clearTimeout(resetTimer);
    resetTimer = setTimeout(() => { state.resetArm = false; renderSettings(); }, 3000);
    renderSettings();
    return;
  }
  state.resetArm = false;
  if (resetTimer) clearTimeout(resetTimer);
  const prevAccounts = state.accounts, prevTxns = state.txns;
  persistAccounts([]); persistTxns([]);
  state.detailId = null;
  renderHeader(); renderContent(); renderTabbar(); renderFab();
  showToast("All data reset", "Undo", () => { persistAccounts(prevAccounts); persistTxns(prevTxns); renderContent(); });
}

/* ---------- export / import ---------- */
function handleExportData() {
  const payload = { app: "wallet-vault", exportedAt: new Date().toISOString(), accounts: state.accounts, transactions: state.txns };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `wallet-vault-backup-${todayInputValue()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  showToast("Backup file downloaded");
}
function handleImportFile(e) {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      const rawAccounts = Array.isArray(data.accounts) ? data.accounts : null;
      const rawTxns = Array.isArray(data.transactions) ? data.transactions : null;
      if (!rawAccounts || !rawTxns) { showToast("That file doesn't look like a Wallet Vault backup"); return; }

      const validIds = new Set();
      const importedAccounts = rawAccounts
        .filter((a) => a && typeof a.id === "string" && typeof a.label === "string" && a.label.trim())
        .map((a) => {
          validIds.add(a.id);
          return {
            id: a.id,
            label: a.label.trim(),
            institution: typeof a.institution === "string" ? a.institution : "",
            category: CATEGORIES[a.category] ? a.category : "other",
            balance: Number.isFinite(Number(a.balance)) ? Number(a.balance) : 0,
          };
        });
      const importedTxns = rawTxns
        .filter((t) => t && validIds.has(t.accountId) && (t.type === "credit" || t.type === "debit") && !isNaN(new Date(t.date).getTime()))
        .map((t) => ({
          id: typeof t.id === "string" ? t.id : genId(),
          accountId: t.accountId,
          type: t.type,
          amount: Number.isFinite(Number(t.amount)) ? Math.abs(Number(t.amount)) : 0,
          note: typeof t.note === "string" && t.note.trim() ? t.note.trim() : (t.type === "credit" ? "Money in" : "Money out"),
          date: new Date(t.date).toISOString(),
          transferId: typeof t.transferId === "string" ? t.transferId : undefined,
        }));

      if (importedAccounts.length === 0) { showToast("No valid accounts found in that file"); return; }

      const prevAccounts = state.accounts, prevTxns = state.txns;
      persistAccounts(importedAccounts); persistTxns(importedTxns);
      state.detailId = null; state.openRowId = null; state.activityFilter = "all"; state.activitySearch = "";
      renderHeader(); renderContent(); renderTabbar(); renderFab();
      showToast(`Imported ${importedAccounts.length} account${importedAccounts.length === 1 ? "" : "s"}`, "Undo", () => {
        persistAccounts(prevAccounts); persistTxns(prevTxns); renderHeader(); renderContent(); renderTabbar(); renderFab();
      });
    } catch (err) {
      showToast("Couldn't read that file — is it a valid backup?");
    } finally { e.target.value = ""; }
  };
  reader.readAsText(file);
}

/* ---------- sheets ---------- */
function closeSheet() {
  state.sheetClosing = true;
  const overlay = document.querySelector(".vv-sheet-overlay");
  if (overlay) overlay.classList.add("closing");
  const sheet = document.querySelector(".vv-sheet");
  if (sheet) sheet.classList.add("closing");
  setTimeout(() => { state.sheet = null; state.sheetClosing = false; document.getElementById("sheetRoot").innerHTML = ""; }, 200);
}

function openFabSheet() {
  document.getElementById("sheetRoot").innerHTML = `
    <div class="vv-sheet-overlay" id="sheetOverlay">
      <div class="vv-sheet">
        <div class="vv-drag-handle"></div>
        <div class="vv-sheet-head"><div class="vv-sheet-title">Quick actions</div></div>
        <div class="vv-fab-menu-item" id="qaAddAccount">
          <div class="vv-fab-menu-icon">${ICONS.plus(18)}</div>
          <div><div class="vv-fab-menu-label">Add account</div><div class="vv-fab-menu-sub">Bank, cash, trading, investment, or other</div></div>
        </div>
        <div class="vv-fab-menu-item" id="qaTransfer">
          <div class="vv-fab-menu-icon">${ICONS.arrowLeftRight(18)}</div>
          <div><div class="vv-fab-menu-label">Transfer money</div><div class="vv-fab-menu-sub">Move balance between your own accounts</div></div>
        </div>
      </div>
    </div>`;
  document.getElementById("sheetOverlay").onclick = (e) => { if (e.target.id === "sheetOverlay") closeSheet(); };
  document.getElementById("qaAddAccount").onclick = () => { closeSheet(); setTimeout(() => openAccountSheet(null), 210); };
  document.getElementById("qaTransfer").onclick = () => { closeSheet(); setTimeout(() => openTransferSheet(""), 210); };
}

function openAccountSheet(editId) {
  state.editingId = editId;
  const acc = editId ? accountById(editId) : null;
  const catGrid = CATEGORY_ORDER.map((c) => `
    <div class="vv-cat-opt${(acc ? acc.category : "bank") === c ? " active" : ""}" data-cat="${c}">
      ${catIconSvg(c, 16, (acc ? acc.category : "bank") === c ? CATEGORIES[c].color : "#8B94A7")}${CATEGORIES[c].label}
    </div>`).join("");
  document.getElementById("sheetRoot").innerHTML = `
    <div class="vv-sheet-overlay" id="sheetOverlay">
      <div class="vv-sheet">
        <div class="vv-drag-handle"></div>
        <div class="vv-sheet-head">
          <div class="vv-sheet-title">${editId ? "Edit account" : "Add account"}</div>
          <button class="vv-header-btn" id="sheetClose">${ICONS.x}</button>
        </div>
        <div class="vv-form-error" id="accountError" style="display:none"></div>
        <div class="vv-field"><label for="fLabel">Account name</label><input id="fLabel" class="vv-input" placeholder="e.g. Salary Account" value="${acc ? esc(acc.label) : ""}"/></div>
        <div class="vv-field"><label for="fInst">Institution (optional)</label><input id="fInst" class="vv-input" placeholder="e.g. HDFC Bank, Zerodha" value="${acc ? esc(acc.institution || "") : ""}"/></div>
        <div class="vv-field"><label>Category</label><div class="vv-cat-grid" id="catGrid">${catGrid}</div></div>
        <div class="vv-field"><label for="fBalance">Balance (₹)${editId ? " — reconciles directly, no transaction logged" : ""}</label><input id="fBalance" class="vv-input" inputmode="decimal" placeholder="0" value="${acc ? acc.balance : ""}"/></div>
        <button class="vv-btn-primary" id="accountSubmit">${ICONS.check} ${editId ? "Save changes" : "Add account"}</button>
      </div>
    </div>`;
  let selectedCat = acc ? acc.category : "bank";
  document.getElementById("sheetOverlay").onclick = (e) => { if (e.target.id === "sheetOverlay") closeSheet(); };
  document.getElementById("sheetClose").onclick = closeSheet;
  document.querySelectorAll("#catGrid [data-cat]").forEach((opt) => {
    opt.onclick = () => {
      selectedCat = opt.getAttribute("data-cat");
      document.querySelectorAll("#catGrid [data-cat]").forEach((o) => o.classList.remove("active"));
      opt.classList.add("active");
      document.querySelectorAll("#catGrid [data-cat]").forEach((o) => {
        const c = o.getAttribute("data-cat");
        o.innerHTML = `${catIconSvg(c, 16, c === selectedCat ? CATEGORIES[c].color : "#8B94A7")}${CATEGORIES[c].label}`;
      });
    };
  });
  document.getElementById("fLabel").focus();
  document.getElementById("accountSubmit").onclick = () => {
    const label = document.getElementById("fLabel").value.trim();
    const institution = document.getElementById("fInst").value.trim();
    const balanceNum = parseFloat(document.getElementById("fBalance").value);
    const errEl = document.getElementById("accountError");
    if (!label) { errEl.textContent = "Give the account a name."; errEl.style.display = "block"; return; }
    if (Number.isNaN(balanceNum)) { errEl.textContent = "Enter a valid balance."; errEl.style.display = "block"; return; }
    if (editId) {
      persistAccounts(state.accounts.map((a) => a.id === editId ? { ...a, label, institution, category: selectedCat, balance: balanceNum } : a));
      showToast(`${label} updated`);
    } else {
      persistAccounts([...state.accounts, { id: genId(), label, institution, category: selectedCat, balance: balanceNum }]);
      showToast(`${label} added`);
    }
    closeSheet();
    renderHeader(); renderContent();
  };
}

function openTransferSheet(fromId) {
  document.getElementById("sheetRoot").innerHTML = `
    <div class="vv-sheet-overlay" id="sheetOverlay">
      <div class="vv-sheet">
        <div class="vv-drag-handle"></div>
        <div class="vv-sheet-head"><div class="vv-sheet-title">Transfer</div><button class="vv-header-btn" id="sheetClose">${ICONS.x}</button></div>
        <div class="vv-form-error" id="transferError" style="display:none"></div>
        <div class="vv-field"><label for="tFrom">From</label>
          <select id="tFrom" class="vv-select"><option value="">Select account</option>
            ${state.accounts.map((a) => `<option value="${a.id}" ${a.id === fromId ? "selected" : ""}>${esc(a.label)} · ${formatINR(a.balance)}</option>`).join("")}
          </select></div>
        <div class="vv-field"><label for="tTo">To</label><select id="tTo" class="vv-select"><option value="">Select account</option></select></div>
        <div class="vv-field"><label for="tAmt">Amount (₹)</label><input id="tAmt" class="vv-input" inputmode="decimal" placeholder="0"/></div>
        <div class="vv-field"><label for="tNote">Note (optional)</label><input id="tNote" class="vv-input" placeholder="e.g. Moving to trading account"/></div>
        <button class="vv-btn-primary" id="transferSubmit" ${state.accounts.length < 2 ? "disabled" : ""}>${ICONS.arrowLeftRight(16)} Transfer</button>
        ${state.accounts.length < 2 ? `<div class="vv-footnote">Add a second account to transfer between accounts.</div>` : ""}
      </div>
    </div>`;
  const refreshToOptions = () => {
    const from = document.getElementById("tFrom").value;
    const toSel = document.getElementById("tTo");
    const current = toSel.value;
    toSel.innerHTML = `<option value="">Select account</option>` + state.accounts.filter((a) => a.id !== from).map((a) => `<option value="${a.id}">${esc(a.label)}</option>`).join("");
    if ([...toSel.options].some((o) => o.value === current)) toSel.value = current;
  };
  refreshToOptions();
  document.getElementById("tFrom").onchange = refreshToOptions;
  document.getElementById("sheetOverlay").onclick = (e) => { if (e.target.id === "sheetOverlay") closeSheet(); };
  document.getElementById("sheetClose").onclick = closeSheet;
  document.getElementById("transferSubmit").onclick = () => {
    const fromId2 = document.getElementById("tFrom").value;
    const toId2 = document.getElementById("tTo").value;
    const amt = parseFloat(document.getElementById("tAmt").value);
    const note = document.getElementById("tNote").value.trim();
    const errEl = document.getElementById("transferError");
    if (!fromId2 || !toId2) { errEl.textContent = "Choose both accounts."; errEl.style.display = "block"; return; }
    if (fromId2 === toId2) { errEl.textContent = "Pick two different accounts."; errEl.style.display = "block"; return; }
    if (Number.isNaN(amt) || amt <= 0) { errEl.textContent = "Enter an amount greater than 0."; errEl.style.display = "block"; return; }
    const fromAcc = accountById(fromId2), toAcc = accountById(toId2);
    const transferId = genId(), dateISO = new Date().toISOString();
    persistAccounts(state.accounts.map((a) => a.id === fromId2 ? { ...a, balance: a.balance - amt } : a.id === toId2 ? { ...a, balance: a.balance + amt } : a));
    persistTxns([...state.txns,
      { id: genId(), accountId: fromId2, type: "debit", amount: amt, note: note || `Transfer to ${toAcc.label}`, date: dateISO, transferId },
      { id: genId(), accountId: toId2, type: "credit", amount: amt, note: note || `Transfer from ${fromAcc.label}`, date: dateISO, transferId },
    ]);
    showToast(`${formatINR(amt)} moved to ${toAcc.label}`);
    closeSheet();
    renderHeader(); renderContent();
  };
}

function openTxnSheet(accountId) {
  document.getElementById("sheetRoot").innerHTML = `
    <div class="vv-sheet-overlay" id="sheetOverlay">
      <div class="vv-sheet">
        <div class="vv-drag-handle"></div>
        <div class="vv-sheet-head"><div class="vv-sheet-title">Add transaction</div><button class="vv-header-btn" id="sheetClose">${ICONS.x}</button></div>
        <div class="vv-form-error" id="txnError" style="display:none"></div>
        <div class="vv-field"><label>Type</label>
          <div class="vv-type-toggle">
            <div class="vv-type-opt credit active" data-type="credit">Money in</div>
            <div class="vv-type-opt debit" data-type="debit">Money out</div>
          </div>
        </div>
        <div class="vv-field"><label for="xAmt">Amount (₹)</label><input id="xAmt" class="vv-input" inputmode="decimal" placeholder="0"/></div>
        <div class="vv-field"><label for="xNote">Note</label><input id="xNote" class="vv-input" placeholder="e.g. Grocery store"/></div>
        <div class="vv-field"><label for="xDate">Date</label><input id="xDate" type="date" class="vv-input" value="${todayInputValue()}"/></div>
        <button class="vv-btn-primary" id="txnSubmit">${ICONS.check} Add transaction</button>
      </div>
    </div>`;
  let selectedType = "credit";
  document.getElementById("sheetOverlay").onclick = (e) => { if (e.target.id === "sheetOverlay") closeSheet(); };
  document.getElementById("sheetClose").onclick = closeSheet;
  document.querySelectorAll(".vv-type-opt").forEach((opt) => {
    opt.onclick = () => {
      selectedType = opt.getAttribute("data-type");
      document.querySelectorAll(".vv-type-opt").forEach((o) => o.classList.remove("active"));
      opt.classList.add("active");
    };
  });
  document.getElementById("txnSubmit").onclick = () => {
    const amt = parseFloat(document.getElementById("xAmt").value);
    const note = document.getElementById("xNote").value.trim();
    const date = document.getElementById("xDate").value;
    const errEl = document.getElementById("txnError");
    if (Number.isNaN(amt) || amt <= 0) { errEl.textContent = "Enter an amount greater than 0."; errEl.style.display = "block"; return; }
    const acc = accountById(accountId);
    if (!acc) return;
    const delta = selectedType === "credit" ? amt : -amt;
    const dateISO = new Date(date + "T12:00:00").toISOString();
    persistAccounts(state.accounts.map((a) => a.id === accountId ? { ...a, balance: a.balance + delta } : a));
    persistTxns([...state.txns, { id: genId(), accountId, type: selectedType, amount: amt, note: note || (selectedType === "credit" ? "Money in" : "Money out"), date: dateISO }]);
    showToast(selectedType === "credit" ? `${formatINR(amt)} added to ${acc.label}` : `${formatINR(amt)} logged from ${acc.label}`);
    closeSheet();
    renderHeader(); renderContent();
  };
}

  applyTheme();
  renderHeader();
  renderContent();
  renderTabbar();
  renderFab();
}
document.addEventListener("DOMContentLoaded", boot);
